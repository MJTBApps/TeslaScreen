<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EspejoCoche</title>
<style>
:root{--bg:#000;--panel:rgba(20,24,29,.92);--line:#323a44;--fg:#eef1f4;--muted:#9aa6b2;--accent:#f07a2e;--ok:#5fd08a;--bad:#ff7a6e;--warn:#f2c35b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#lienzo{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#barra{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;transition:opacity .3s}
#barra.oculta{opacity:0;pointer-events:none}
input{font:inherit;background:#0e1115;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:10em}
button{font:inherit;background:var(--accent);color:#111;border:0;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer}
button.sec{background:var(--line);color:var(--fg)}
#estado{font-variant-numeric:tabular-nums;color:var(--muted);flex:1 1 16em}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-weight:600;font-size:15px;margin-right:8px}
.ok{background:#1f3b2a;color:var(--ok)}.bad{background:#40211e;color:var(--bad)}.warn{background:#3d3218;color:var(--warn)}
#aviso{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(560px,calc(100% - 32px));text-align:center;color:var(--muted)}
#aviso b{color:var(--fg);font-size:24px;display:block;margin-bottom:8px}
</style>
</head>
<body>
<canvas id="lienzo" width="16" height="9"></canvas>
<div id="aviso"><b>Esperando al móvil…</b>Abre EspejoCoche en el móvil, pulsa «Empezar» y comprueba que el coche está en su punto de acceso.</div>
<div id="barra">
  <label for="ip">IP</label>
  <input id="ip" inputmode="decimal" autocomplete="off">
  <button id="conectar">Conectar</button>
  <button class="sec" id="completa">Pantalla completa</button>
  <span id="estado"><span class="pill warn">sin conectar</span></span>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const PUERTO = 8765;
const RED_LOCAL = { targetAddressSpace: "local" }; // permiso de red local (Chrome 142+)
const lienzo = $("lienzo"), ctx = lienzo.getContext("2d");

function pintarEstado(clase, texto, datos) {
  $("estado").innerHTML = '<span class="pill ' + clase + '">' + texto + "</span>" + (datos || "");
}

// ---------- Barra que se esconde sola ----------
let temporizador = null;
function mostrarBarra() {
  $("barra").classList.remove("oculta");
  clearTimeout(temporizador);
  temporizador = setTimeout(() => { if (recibiendo) $("barra").classList.add("oculta"); }, 4000);
}
lienzo.addEventListener("pointerdown", mostrarBarra);

// ---------- H.264 ----------
function nals(d) {
  const r = [];
  for (let i = 0; i + 3 < d.length; i++) {
    if (d[i] === 0 && d[i + 1] === 0 && (d[i + 2] === 1 || (d[i + 2] === 0 && d[i + 3] === 1))) {
      const ini = i + (d[i + 2] === 1 ? 3 : 4);
      r.push(ini); i = ini;
    }
  }
  return r;
}
function codecDe(d) {
  for (const i of nals(d)) if ((d[i] & 0x1f) === 7) {
    const h = x => x.toString(16).padStart(2, "0");
    return { codec: "avc1." + h(d[i + 1]) + h(d[i + 2]) + h(d[i + 3]), sps: Array.from(d.subarray(i, i + 24)).join(",") };
  }
  return null;
}

// ---------- Recepción ----------
let sesion = 0, recibiendo = false, desfaseMs = 0;
let dec = null, spsActual = "", esperarClave = true;
let cuenta = { fotos: 0, bytes: 0, retraso: 0, n: 0, t: performance.now() };
let ultimoFoto = 0;

function nuevoDecodificador() {
  if (dec && dec.state !== "closed") dec.close();
  dec = new VideoDecoder({
    output(f) {
      if (lienzo.width !== f.displayWidth || lienzo.height !== f.displayHeight) { lienzo.width = f.displayWidth; lienzo.height = f.displayHeight; }
      ctx.drawImage(f, 0, 0);
      // Retraso: del momento de la captura en el móvil a dibujarlo aquí.
      const r = performance.now() - (f.timestamp / 1000 - desfaseMs);
      if (r > 0 && r < 5000) { cuenta.retraso += r; cuenta.n++; }
      f.close();
      cuenta.fotos++; ultimoFoto = performance.now();
    },
    error(e) { console.warn(e); spsActual = ""; esperarClave = true; },
  });
}

function paquete(clave, ts, datos) {
  if (clave) {
    const c = codecDe(datos);
    if (c && c.sps !== spsActual) {
      // Primer fotograma o el móvil ha girado (cambia el tamaño): se reconfigura.
      if (!dec || dec.state === "closed") nuevoDecodificador(); else dec.reset();
      dec.configure({ codec: c.codec, optimizeForLatency: true });
      spsActual = c.sps;
    }
    esperarClave = false;
  }
  if (esperarClave || !dec || dec.state !== "configured") return;
  if (dec.decodeQueueSize > 8) { esperarClave = true; return; } // va atrasado: saltar al siguiente fotograma clave
  dec.decode(new EncodedVideoChunk({ type: clave ? "key" : "delta", timestamp: ts, data: datos }));
}

function nuevoLector() {
  let resto = new Uint8Array(0);
  return trozo => {
    cuenta.bytes += trozo.length;
    const b = new Uint8Array(resto.length + trozo.length);
    b.set(resto); b.set(trozo, resto.length);
    const dv = new DataView(b.buffer);
    let i = 0;
    while (b.length - i >= 13) {
      const largo = dv.getUint32(i);
      if (b.length - i - 4 < largo) break;
      const ts = Number(dv.getBigUint64(i + 5));
      paquete(b[i + 4] === 1, ts, b.subarray(i + 13, i + 4 + largo));
      i += 4 + largo;
    }
    resto = b.slice(i);
  };
}

async function sincronizarReloj(base) {
  // Diferencia entre el reloj del móvil y el de esta página (el ping más rápido de 5).
  let mejor = Infinity;
  for (let k = 0; k < 5; k++) {
    const t0 = performance.now();
    const j = await (await fetch(base + "/ping?n=" + k, { cache: "no-store", ...RED_LOCAL })).json();
    const t1 = performance.now();
    if (t1 - t0 < mejor) { mejor = t1 - t0; desfaseMs = j.relojUs / 1000 - (t0 + t1) / 2; }
  }
  return mejor;
}

async function porFetch(base, mia) {
  const r = await fetch(base + "/flujo", { cache: "no-store", ...RED_LOCAL });
  const lector = r.body.getReader(), meter = nuevoLector();
  for (;;) {
    if (mia !== sesion) { lector.cancel(); return; }
    const { done, value } = await lector.read();
    if (done) throw new Error("el móvil ha cortado");
    meter(value);
  }
}

function porWebSocket(base, mia) {
  return new Promise((_, mal) => {
    const ws = new WebSocket(base.replace("http", "ws") + "/ws");
    ws.binaryType = "arraybuffer";
    const meter = nuevoLector();
    ws.onmessage = e => { if (mia !== sesion) ws.close(); else meter(new Uint8Array(e.data)); };
    ws.onerror = () => mal(new Error("WebSocket sin conexión"));
    ws.onclose = () => mal(new Error("WebSocket cerrado"));
  });
}

let camino = "";
async function conectar() {
  const ip = $("ip").value.trim();
  if (!/^[\w.:-]+$/.test(ip)) { pintarEstado("bad", "IP no válida"); return; }
  try { localStorage.setItem("espejocoche_ip", ip); } catch (e) {}
  const mia = ++sesion;
  const base = "http://" + ip + ":" + PUERTO;
  spsActual = ""; esperarClave = true;
  if (!("VideoDecoder" in window)) { pintarEstado("bad", "este navegador no tiene WebCodecs"); return; }
  nuevoDecodificador();
  while (mia === sesion) {
    try {
      pintarEstado("warn", "buscando el móvil…");
      // Si fetch está bloqueado (página https → http local), se prueba el WebSocket sin medir el retraso.
      let rtt = null;
      try { rtt = await sincronizarReloj(base); } catch (e) { console.warn("ping:", e); desfaseMs = NaN; }
      if (mia !== sesion) return;
      recibiendo = true; mostrarBarra();
      if (rtt !== null) {
        try { camino = "fetch"; await porFetch(base, mia); }
        catch (e) { if (mia !== sesion) return; console.warn("fetch:", e); }
      }
      camino = "WebSocket"; await porWebSocket(base, mia);
    } catch (e) {
      recibiendo = false; mostrarBarra();
      pintarEstado("bad", "sin conexión", " " + e.message + " · reintento en 2 s");
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}

// ---------- Datos cada segundo ----------
setInterval(() => {
  const ahora = performance.now(), s = (ahora - cuenta.t) / 1000;
  const conImagen = ahora - ultimoFoto < 1500;
  $("aviso").style.display = conImagen ? "none" : "";
  if (recibiendo) {
    const datos = " " + camino + " · " + (cuenta.fotos / s).toFixed(0) + " fps · " + (cuenta.bytes * 8 / 1e6 / s).toFixed(1) + " Mbps" +
      (cuenta.n ? " · retraso " + (cuenta.retraso / cuenta.n).toFixed(0) + " ms" : "") + " · " + lienzo.width + "×" + lienzo.height;
    pintarEstado(conImagen ? "ok" : "warn", conImagen ? "en vivo" : "sin imagen", datos);
  }
  cuenta = { fotos: 0, bytes: 0, retraso: 0, n: 0, t: ahora };
}, 1000);

// ---------- Botones ----------
$("conectar").addEventListener("click", conectar);
$("completa").addEventListener("click", () => {
  const p = document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject();
  p.catch(() => pintarEstado("warn", "pantalla completa no disponible"));
});
if ("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(() => {});

let guardada = "";
try { guardada = localStorage.getItem("espejocoche_ip") || ""; } catch (e) {}
$("ip").value = new URLSearchParams(location.search).get("ip") || guardada || "172.20.10.1";
conectar();
</script>
</body>
</html>
